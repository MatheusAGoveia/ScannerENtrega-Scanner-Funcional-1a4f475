name: govsec-scanner

x-backend-environment: &backend-environment
  SCANNER_ENVIRONMENT: ${SCANNER_ENVIRONMENT:-production}
  DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL}
  SCANNER_DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL}
  SCANNER_API_KEY: ${SCANNER_API_KEY:?defina SCANNER_API_KEY}
  SCANNER_ALLOW_PUBLIC_TARGETS: ${SCANNER_ALLOW_PUBLIC_TARGETS:-false}
  SCANNER_MAX_ADDRESSES_PER_RANGE: ${SCANNER_MAX_ADDRESSES_PER_RANGE:-4096}
  SCANNER_NUCLEI_TEMPLATES_DIR: /opt/nuclei-templates
  SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET}
  SCANNER_AUTH_USER: ${SCANNER_AUTH_USER:?defina SCANNER_AUTH_USER}
  SCANNER_AUTH_PASS: ${SCANNER_AUTH_PASS:?defina SCANNER_AUTH_PASS}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [scanner_internal]

  migrations:
    build: ./backend
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [scanner_internal]

  api:
    build: ./backend
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:8000:8000"
    networks: [scanner_internal]

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "govsec_scanner.worker"]
    environment: *backend-environment
    cap_add:
      - NET_RAW
      - NET_BIND_SERVICE
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "govsec_scanner.healthcheck", "--service", "worker"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [scanner_internal]

  scheduler:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "govsec_scanner.scheduler"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "govsec_scanner.healthcheck", "--service", "scheduler"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [scanner_internal]

networks:
  scanner_internal:
    driver: bridge

volumes:
  postgres_data:
